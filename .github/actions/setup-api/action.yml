name: Set up API documentation producer
description: Install the pinned ZARD JSON producer without running Rigor lens
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: rigortype/zard
        ref: db05ce49d62e47c51f3214a2686847f0f5ba29a0
        path: .api-producer
        persist-credentials: false
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: false
    - name: Install the pinned parser
      shell: bash
      run: gem install prism --version 1.9.0 --no-document
    - name: Select the producer for subsequent build steps
      shell: bash
      run: echo "ZARD_SOURCE_DIR=$GITHUB_WORKSPACE/.api-producer" >> "$GITHUB_ENV"
