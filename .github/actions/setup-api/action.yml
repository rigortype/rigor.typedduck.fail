name: Set up API documentation producer
description: Install the pinned ZARD producer and released Rigor lens
inputs:
  lens:
    description: Enable experimental lens (requires a compatible source tree)
    default: '1'
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: rigortype/zard
        ref: c4717eb7cb55b76f0a0ac6a11686fe470aec5255
        path: .api-producer
        persist-credentials: false
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '4.0'
        bundler-cache: false
    - name: Install pinned parser
      shell: bash
      run: |
        gem install prism --version 1.9.0 --no-document
    - name: Install optional released analyzer
      if: inputs.lens == '1'
      shell: bash
      run: |
        RIGOR_VERSION=$(ruby -rjson -e 'puts JSON.parse(File.read(".api-producer/zard-rigor/lib/zard/rigor/compatibility.json")).fetch("default_version")')
        gem install rbs --version 4.2.0 --no-document
        gem install language_server-protocol --version 3.17.0.6 --no-document
        gem install rigortype --version "$RIGOR_VERSION" --no-document
        gem install rbs-inline --version 0.14.0 --no-document
        gem install digest-xxhash --version 0.2.9 --no-document
    - name: Select the producer for subsequent build steps
      shell: bash
      run: |
        echo "ZARD_SOURCE_DIR=$GITHUB_WORKSPACE/.api-producer" >> "$GITHUB_ENV"
        echo 'RIGOR_LENS=${{ inputs.lens }}' >> "$GITHUB_ENV"
